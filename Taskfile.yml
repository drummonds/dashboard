version: "3"

tasks:
  docs:build:
    desc: Render d2 diagram and assemble docs/
    cmds:
      - mkdir -p docs
      - d2 dashboard.d2 docs/dashboard.svg
      # d2 writes 0600; rsync deploy preserves modes, so open it up for Caddy
      - chmod 644 docs/dashboard.svg
      - go run ./cmd/svgpost -svg docs/dashboard.svg -html index.html
      - |
        sed '/<!-- SVG_PLACEHOLDER -->/{
          r docs/dashboard.svg
          d
        }' index.html > docs/index.html
      - cp annotated-repo-symbol.svg docs/
      - task-plus md2html --file README.md --dst docs --project dashboard --label Docs
      - task-plus md2html --file repo-symbol-design.md --dst docs --project dashboard --label Design
    sources:
      - dashboard.d2
      - index.html
      - repos.json
      - README.md
      - repo-symbol-design.md
      - annotated-repo-symbol.svg
      - cmd/svgpost/main.go
    generates:
      - docs/dashboard.svg
      - docs/index.html
      - docs/README.html
      - docs/repo-symbol-design.html
      - docs/annotated-repo-symbol.svg

  refresh:
    desc: Refresh dashboard stats from Forgejo/GitHub APIs
    cmds:
      - go run ./cmd/refresh

  dia:
    desc: Scan forges, refresh diagrams, commit, push and deploy the dashboard
    cmds:
      - go run ./cmd/refresh -add
      - task docs:build
      - git add repos.json index.html dashboard.d2 docs/dashboard.svg docs/index.html
      - git diff --cached --quiet || git commit -m "Refresh dashboard stats and diagrams"
      - git push origin main
      # statichost rebuilt from git on its own; the rsync site needs an explicit deploy
      - task-plus pages deploy

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w .

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...

  clean:
    desc: Remove generated files
    cmds:
      - rm -rf docs

  check:
    desc: Check prior to deployment
    cmds:
      - task fmt
      - task vet
      - task test
      - task docs:build
